name: sync-dns

on:
  push:
    branches: [main]
    paths: ['domains/**']

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: changed
        run: |
          # Diff the whole push range, not HEAD^..HEAD. Actions fires one push event per
          # push, not per commit, so a rebase-merge or a batch of merges lands several
          # commits at once and HEAD^..HEAD would silently skip every domains/ file touched
          # by any but the last — a merged PR that never reaches DNS, with no error at all.
          BEFORE='${{ github.event.before }}'
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE=$(git rev-list --max-parents=0 HEAD | tail -1)
          else
            RANGE="$BEFORE"
          fi
          echo 'files<<EOF' >> $GITHUB_OUTPUT
          git diff --name-only "$RANGE" '${{ github.event.after }}' -- domains/ >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT
      - run: node scripts/sync-dns.mjs
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
